server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    index index.html;

    location = /status/auth {
        set $backend auth-service:8081;
        proxy_pass http://$backend/actuator/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @auth_unavailable;
    }
    location = /status/courses {
        set $backend course-service:8082;
        proxy_pass http://$backend/actuator/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @courses_unavailable;
    }
    location = /status/enrollments {
        set $backend enrollment-service:8083;
        proxy_pass http://$backend/actuator/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @enrollments_unavailable;
    }
    location = /status/grades {
        set $backend grade-service:8084;
        proxy_pass http://$backend/actuator/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @grades_unavailable;
    }

    location @auth_unavailable { default_type application/json; return 503 '{"message":"Authentication service is currently unavailable. Please try again later."}'; }
    location @courses_unavailable { default_type application/json; return 503 '{"message":"Course service is currently unavailable. Please try again later."}'; }
    location @enrollments_unavailable { default_type application/json; return 503 '{"message":"Enrollment service is currently unavailable. Please try again later."}'; }
    location @grades_unavailable { default_type application/json; return 503 '{"message":"Grade service is currently unavailable. Please try again later."}'; }

    location /api/auth/ {
        set $backend auth-service:8081;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @auth_unavailable;
    }
    location /api/courses/ {
        set $backend course-service:8082;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @courses_unavailable;
    }
    location = /api/courses {
        set $backend course-service:8082;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @courses_unavailable;
    }
    location /api/enrollments/ {
        set $backend enrollment-service:8083;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @enrollments_unavailable;
    }
    location = /api/enrollments {
        set $backend enrollment-service:8083;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @enrollments_unavailable;
    }
    location /api/grades/ {
        set $backend grade-service:8084;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 = @grades_unavailable;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
