server:
  port: 8082
spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-primary}:5432/course_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: CourseHikariPool
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}
grpc:
  server:
    port: 9090
logging:
  level:
    com.example.enrollment: INFO
