server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-primary}:5432/auth_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: AuthHikariPool
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}
  access-token-minutes: 10
  refresh-token-days: 7
  google-client-id: ${GOOGLE_CLIENT_ID:}
logging:
  level:
    com.example.enrollment: INFO
