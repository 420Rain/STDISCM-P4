server:
  port: 8084
spring:
  application:
    name: grade-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-primary}:5432/grade_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: GradeHikariPool
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}
  course-host: ${COURSE_GRPC_HOST:course-service}
  course-port: ${COURSE_GRPC_PORT:9090}
  enrollment-host: ${ENROLLMENT_GRPC_HOST:enrollment-service}
  enrollment-port: ${ENROLLMENT_GRPC_PORT:9091}
logging:
  level:
    com.example.enrollment: INFO
